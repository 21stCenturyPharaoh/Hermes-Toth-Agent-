<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="HALLEL — Pharaoh Chamber Offline Player. All glory to Yah. Hebrews 1; Isaiah 43:11.">
<meta name="author" content="Pharaoh Angels Incorporated dba Micdom AI Records">
<meta name="keywords" content="HALLEL, Pharaoh Chamber, Hebrews 1, Isaiah 43:11, Yah, Metatron Offline Player">
<meta name="theme-color" content="#050505">
<title>HALLEL | Pharaoh Chamber Offline Player</title>
<style>
:root{color-scheme:dark;--gold:#d7b45b;--black:#050505;--fade:300ms}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
.player{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity var(--fade) ease;pointer-events:none}
.player.active{opacity:1}
/* Portrait source is 720x1280 (9:16). Contain preserves every part of the chamber. */
#controls{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;opacity:.92}
#controls button,#command{font:600 14px/1.2 system-ui,sans-serif;border:1px solid #9e813c;border-radius:8px;background:rgba(0,0,0,.82);color:#ffe6a0;padding:10px 12px;min-height:42px}
#controls button:focus-visible,#command:focus-visible{outline:3px solid #fff;outline-offset:2px}
#command{width:min(210px,48vw);min-width:120px}#status{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:9;background:rgba(0,0,0,.68);color:#f4d887;font-size:12px;padding:5px 8px;border-radius:5px;max-width:90vw}
#help{position:fixed;top:35px;left:8px;z-index:9;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:5px 8px;border-radius:5px;max-width:94vw}
body.clean #controls,body.clean #status,body.clean #help{display:none}
@media (orientation:landscape){#controls{bottom:8px}#status{font-size:10px}}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
</style>
</head>
<body>
<main id="stage" aria-label="Pharaoh Chamber video stage">
 <video id="videoA" class="player active" playsinline webkit-playsinline muted preload="auto" loop></video>
 <video id="videoB" class="player" playsinline webkit-playsinline muted preload="auto" loop></video>
</main>
<div id="status" role="status" aria-live="polite">HALLEL • METATRON OFFLINE PLAYER</div>
<div id="help">Commands: !welcome !shocked !thinking !breaking !nod !neutral !idle !bye · Tap a state or enter a command below.</div>
<div id="controls" aria-label="Offline state controls">
 <button data-command="!idle">Idle</button><button data-command="!welcome">Welcome</button><button data-command="!shocked">Shocked</button><button data-command="!thinking">Thinking</button><button data-command="!breaking">Breaking</button><button data-command="!nod">Nod</button><button data-command="!neutral">Neutral</button><button data-command="!bye">Signoff</button>
 <input id="command" aria-label="Chat command" placeholder="Type !welcome" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="send">Go</button><button id="cleanToggle" aria-label="Hide controls">Hide UI</button>
</div>
<script>
(()=>{'use strict';
const STATES={idle:{file:'idle.mp4',sound:'silent'},welcome:{file:'welcome.mp4',sound:'applause'},shocked:{file:'shocked.mp4',sound:'surprise'},neutral:{file:'neutral.mp4',sound:'silent'},thinking:{file:'thinking.mp4',sound:'silent'},breaking:{file:'breaking.mp4',sound:'breaking'},nodding:{file:'nodding.mp4',sound:'mmhmm'},signoff:{file:'signoff.mp4',sound:'applause'}};
const aliases={'!welcome':'welcome','!shocked':'shocked','!thinking':'thinking','!breaking':'breaking','!nod':'nodding','!neutral':'neutral','!idle':'idle','!bye':'signoff'};
const status=document.getElementById('status'), help=document.getElementById('help'), command=document.getElementById('command');
let front=document.getElementById('videoA'),back=document.getElementById('videoB'),current='idle',audioCtx=null,activeNodes=[];
function setStatus(s){status.textContent=s}
function stopSound(){activeNodes.forEach(n=>{try{n.stop?.()}catch(e){}try{n.disconnect?.()}catch(e){}});activeNodes=[]}
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,start,duration,type='sine',gain=.12,slide=0){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,freq+slide),start+duration);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+duration+.03);activeNodes.push(o,g)}
function noise(start,duration,gain=.05){const c=ctx(),len=Math.ceil(c.sampleRate*duration),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();src.buffer=buf;f.type='lowpass';f.frequency.value=1800;g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(gain,start+.03);g.gain.setValueAtTime(gain,start+duration*.6);g.gain.linearRampToValueAtTime(.0001,start+duration);src.connect(f);f.connect(g);g.connect(c.destination);src.start(start);src.stop(start+duration);activeNodes.push(src,g,f)}
function sound(kind){stopSound();if(kind==='silent')return;let c;try{c=ctx()}catch(e){setStatus('Sound needs a tap to unlock; video is running.');return}const t=c.currentTime+.04;
 if(kind==='applause'){for(let i=0;i<16;i++)noise(t+i*.105,.13,.045+Math.random()*.045)}
 if(kind==='surprise'){tone(520,t,.28,'sine',.16,240);tone(780,t+.25,.5,'sine',.15,160);tone(620,t+.82,.42,'sine',.12,-180)}
 if(kind==='breaking'){for(let i=0;i<3;i++){const q=t+i*.52;tone(58,q,.16,'sine',.35,-18);tone(42,q+.16,.19,'sine',.25,-8)}tone(110,qSafe(t,1.65),.75,'sawtooth',.13,-70);noise(t+1.65,.38,.1)}
 if(kind==='mmhmm'){tone(185,t,.24,'triangle',.11,20);tone(220,t+.28,.34,'triangle',.11,15)}
}
function qSafe(t,d){return t+d}
async function switchState(name){if(!STATES[name])return;current=name;localStorage.setItem('pharaohChamberLastState',name);const target=STATES[name].file;back.src=target;back.loop=true;back.muted=true;back.load();try{await back.play()}catch(e){setStatus('Tap the screen once to start video playback.');}
 // Crossfade only after the new file has a decoded frame when possible.
 if(back.readyState<2){await new Promise(resolve=>{let done=false;const finish=()=>{if(!done){done=true;resolve()}};back.addEventListener('loadeddata',finish,{once:true});setTimeout(finish,700)})}
 back.classList.add('active');front.classList.remove('active');const old=front;front=back;back=old;setStatus('HALLEL • '+name.toUpperCase()+' • DJ DEHRTAY DOG');sound(STATES[name].sound);
}
function runCommand(raw){const key=String(raw||'').trim().toLowerCase().split(/\s+/)[0];const name=aliases[key];if(!name){setStatus('Unknown command. Try !welcome, !breaking, !nod or !bye.');return}switchState(name)}
document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>runCommand(b.dataset.command)));
document.getElementById('send').addEventListener('click',()=>{runCommand(command.value);command.value='';command.blur()});command.addEventListener('keydown',e=>{if(e.key==='Enter'){runCommand(command.value);command.value=''}});
document.getElementById('cleanToggle').addEventListener('click',()=>{document.body.classList.toggle('clean');const hidden=document.body.classList.contains('clean');if(!hidden){setStatus('HALLEL • '+current.toUpperCase());} });
// Any tap on the video stage unlocks playback/audio on Android Chrome.
document.getElementById('stage').addEventListener('click',()=>{try{ctx()}catch(e){}if(front.paused)front.play().catch(()=>{});setStatus('HALLEL • '+current.toUpperCase()+' • READY')});
// Initial state: remembered state if valid, otherwise idle.
const saved=localStorage.getItem('pharaohChamberLastState');const start=STATES[saved]?saved:'idle';front.src=STATES[start].file;front.loop=true;front.muted=true;front.load();front.play().catch(()=>setStatus('Tap the chamber once to begin playback.'));current=start;localStorage.setItem('pharaohChamberLastState',start);setStatus('HALLEL • '+start.toUpperCase()+' • METATRON OFFLINE PLAYER');
// Note: a standalone offline HTML page cannot receive TikTok LIVE chat events by itself.
// These controls accept the same commands locally; a chat bridge would be a separate online component.
window.pharaohCommand=runCommand;
})();
</script>
</body>
</html>
