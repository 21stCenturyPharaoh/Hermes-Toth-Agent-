<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<title>Pharaoh Chamber - DJ Dehrtay Dog</title>
<style>
:root{--gold:#d4af37;--gold2:#ffd54a;--ink:#070604;--dim:#8c6a13}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--gold);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#stage{position:fixed;inset:0;height:100dvh;background:radial-gradient(120% 70% at 50% 28%,#2a1f06 0%,#0b0804 55%,#000 100%)}
#sphinx{position:absolute;left:0;right:0;bottom:30%;width:100%;opacity:.9}
#banner{position:absolute;top:12.5dvh;left:0;right:0;display:flex;background:var(--gold);color:#000;font-weight:700;font-size:13px;letter-spacing:.12em}
#banner b{background:#000;color:var(--gold2);padding:8px 12px;white-space:nowrap}
#tick{overflow:hidden;flex:1;white-space:nowrap;padding:8px 0}
#tick span{display:inline-block;padding-left:100%;animation:t 26s linear infinite}
@keyframes t{to{transform:translateX(-100%)}}
#prod{position:absolute;top:calc(12.5dvh + 46px);right:11%;display:flex;gap:6px}
#prod i{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:#120d03;display:grid;place-items:center;font:700 11px Georgia;font-style:normal}
#chair{position:absolute;left:50%;top:24%;transform:translateX(-50%);height:38dvh;aspect-ratio:9/16;max-width:72vw;border:3px solid var(--gold);border-radius:14px;overflow:hidden;background:#0a0703;box-shadow:0 0 36px rgba(212,175,55,.35)}
#v{width:100%;height:100%;object-fit:cover;display:block}
#ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:12px;background:#0a0703}
#ph em{font-size:56px;font-style:normal}
#lt{position:absolute;left:11%;right:19%;bottom:35%;border-left:4px solid var(--gold2);background:rgba(0,0,0,.72);padding:8px 12px}
#lt h1{font-size:17px;letter-spacing:.08em;color:var(--gold2)}
#lt p{font-size:13px;color:#e9d9a0;margin-top:2px;min-height:1.2em}
#g{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(rgba(255,0,0,.1),rgba(255,0,0,.1)) top/100% 12.5% no-repeat}
#g:before{content:"comments + CTA";position:absolute;left:0;right:0;bottom:0;height:34%;border-top:2px dashed #f55;color:#f88;font-size:11px;padding:4px 8px;background:rgba(255,0,0,.08)}
#g:after{content:"gifts";position:absolute;top:0;right:0;bottom:34%;width:15%;border-left:2px dashed #f55;color:#f88;font-size:11px;padding:4px;background:rgba(255,0,0,.06)}
body.guides #g{display:block}
#dot{position:fixed;left:3px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.35;z-index:50;border:0;padding:12px;background-clip:content-box;box-sizing:content-box;margin:-12px}
#dr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0d0a04;border-top:2px solid var(--gold);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0));max-height:62dvh;overflow:auto;display:none}
body.open #dr{display:block}
.row{display:grid;gap:6px;margin-bottom:8px}.c4{grid-template-columns:repeat(4,1fr)}.c2{grid-template-columns:1fr 1fr}
button{font:700 11px Georgia;letter-spacing:.06em;color:var(--gold);background:#16110a;border:1px solid var(--dim);border-radius:8px;padding:11px 4px}
button.on{background:var(--gold);color:#000;border-color:var(--gold2)}
button.miss{opacity:.4;text-decoration:line-through}
button.go{background:var(--gold);color:#000}
#log{font:10px monospace;color:#b99a3a;height:64px;overflow:auto;background:#000;border:1px solid #2a2008;border-radius:6px;padding:4px;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){#tick span{animation:none;padding-left:8px}}
</style>
</head>
<body class="guides open">
<div id="stage">
 <svg id="sphinx" viewBox="0 0 360 170" aria-hidden="true">
  <circle cx="180" cy="62" r="44" fill="#d4af37" opacity=".13"/>
  <polygon points="10,150 80,70 150,150" fill="#d4af37" opacity=".1"/>
  <polygon points="215,150 290,52 360,150" fill="#d4af37" opacity=".1"/>
  <path d="M40 158V138q0-14 18-14h150q36 0 40 16l6 18z" fill="#d4af37" opacity=".32"/>
  <path d="M232 128V96q0-18 20-20h10q20 2 20 20v32z" fill="#d4af37" opacity=".32"/>
  <path d="M236 82l-10 46h66l-10-46q-22-14-46 0z" fill="#d4af37" opacity=".4"/>
 </svg>
 <div id="banner"><b>BREAKING NEWS</b><div id="tick"><span>TIKTOK LIVE &bull; MONROVIA TO ZION &bull; LIBERIA &rarr; ASIA &rarr; WORLD &bull; PHARAOH CHAMBER &bull; SPHINX LOCKED &bull; MICDOM AI RECORDS &bull;</span></div></div>
 <div id="prod"><i>EP1</i><i>EP2</i><i>EP3</i></div>
 <div id="chair"><video id="v" muted loop autoplay playsinline></video><div id="ph"><em id="phE"></em><div id="phT"></div></div></div>
 <div id="lt"><h1>PHARAOH &times; METATRON LIVE</h1><p id="ltp">Chamber ready</p></div>
 <div id="g"><span style="position:absolute;top:4px;left:8px;font-size:11px;color:#f88">profile + viewers</span></div>
</div>
<button id="dot" aria-label="Controls"></button>
<div id="dr">
 <div class="row c4" id="ex"></div>
 <div class="row c2"><button class="go" id="bStart">START SHOW</button><button id="bNext">NEXT SEGMENT</button><button id="bAsk">ASK METATRON</button><button id="bOk">APPROVE</button></div>
 <div class="row c2"><button id="bGuides">GUIDES ON/OFF</button><button class="go" id="bStage">STAGE MODE</button></div>
 <div id="log"></div>
</div>
<script>
// ---- CONFIG ----
const METATRON_API = "";   // paste your Metatron endpoint URL here (POST {message}); empty = log only
const SEGMENTS = ["HALLEL LARP: Choose Order","Council assigns Team","Choose Persona"];
const EX = [["idle","IDLE","\u{1F43E}"],["welcome","WELCOME","\u{1F44B}"],["shocked","SHOCKED","\u{1F631}"],["neutral","NEUTRAL","\u{1F436}"],["thinking","THINKING","\u{1F914}"],["breaking","BREAKING","\u{1F6A8}"],["signoff","SIGNOFF","\u270C\uFE0F"],["nodding","NODDING","\u{1F44D}"]];
const HOLD_MS = 6500;
// ---- STATE ----
const $ = id => document.getElementById(id), v = $("v"), P = {}, btn = {};
let cur = "", seg = 0, timer = 0, wl = null;
function log(m){ console.log("[chamber]", m); const l=$("log"); l.textContent += m + "\n"; l.scrollTop = l.scrollHeight; }
function lt(h,p){ $("lt").querySelector("h1").innerHTML = h; $("ltp").textContent = p || ""; }
// ---- CLIPS: find dj/<id>.mp4, then ./<id>.mp4 ----
function probe(id){
  const paths = ["dj/"+id+".mp4", id+".mp4"]; let i = 0;
  const t = document.createElement("video"); t.preload = "metadata"; t.muted = true;
  t.onloadedmetadata = () => { P[id] = paths[i]; btn[id].classList.remove("miss"); log("found "+paths[i]); };
  t.onerror = () => { if (++i < paths.length) t.src = paths[i]; else { P[id] = null; btn[id].classList.add("miss"); log("MISSING "+id+".mp4"); } };
  t.src = paths[0];
}
function show(id){
  v.style.display = "block"; $("ph").style.display = "none";
  if (P[id]) { v.src = P[id]; v.play().catch(()=>{}); }
  else { v.pause(); v.removeAttribute("src"); v.style.display = "none"; const e = EX.find(x=>x[0]===id);
         $("phE").textContent = e[2]; $("phT").textContent = e[1] + " - clip missing"; $("ph").style.display = "flex"; }
}
function setExp(id, hold){
  clearTimeout(timer); cur = id; show(id);
  for (const k in btn) btn[k].classList.toggle("on", k === id);
  log("expression: " + id);
  if (id !== "idle" && !hold) timer = setTimeout(() => setExp("idle"), HOLD_MS);
}
EX.forEach(([id,label]) => { const b = document.createElement("button"); b.textContent = label; b.onclick = () => setExp(id); $("ex").appendChild(b); btn[id] = b; });
// ---- ACTIONS ----
$("bStart").onclick = () => { seg = 0; setExp("welcome"); lt("PHARAOH &times; METATRON LIVE","Show starting"); log("START SHOW"); };
$("bNext").onclick = () => { const s = SEGMENTS[seg++ % SEGMENTS.length]; setExp("nodding"); lt("NEXT SEGMENT", s); log("NEXT SEGMENT: " + s); };
$("bOk").onclick = () => { setExp("nodding"); lt("APPROVED","\u2713 Approved by the chair"); log("APPROVE"); };
$("bAsk").onclick = async () => {
  const q = prompt("Ask Metatron:"); if (!q) return;
  setExp("thinking", true); lt("METATRON","Thinking..."); log("ASK: " + q);
  if (!METATRON_API) { log("No METATRON_API set - edit the CONFIG line in stage.html"); setTimeout(() => setExp("idle"), 2500); return; }
  try {
    const r = await fetch(METATRON_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:q})});
    const d = await r.json(); const a = d.reply || d.answer || d.response || JSON.stringify(d);
    lt("METATRON", String(a).slice(0,160)); log("METATRON: " + a); setExp("neutral");
  } catch(e){ lt("METATRON","Unavailable"); log("API error: " + e.message); setExp("idle"); }
};
// ---- STAGE MODE ----
async function wake(){ try { wl = await navigator.wakeLock.request("screen"); log("wake lock ON"); } catch(e){ log("wake lock unavailable: " + e.message); } }
$("bGuides").onclick = () => document.body.classList.toggle("guides");
$("bStage").onclick = () => {
  document.body.classList.remove("guides","open"); wake();
  (document.documentElement.requestFullscreen || (()=>0)).call(document.documentElement).catch?.(()=>{});
  log("STAGE MODE - tap the dot (left edge) for controls");
};
$("dot").onclick = () => document.body.classList.toggle("open");
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wl && wl.released) wake(); });
// ---- INIT ----
EX.forEach(([id]) => probe(id));
setTimeout(() => setExp("idle"), 600);
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
